name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["index.html", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check the page
        run: |
          grep -q 'name="viewport"' index.html
          true
          true
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: mkdir -p _site && cp index.html _site/ && cp -r assets _site/ && (cp -r data _site/ 2>/dev/null || true)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
